# Logs en JSON hacia stdout (observabilidad)
log_format json_combined escape=json
  '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
  '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
  '"referer":"$http_referer","ua":"$http_user_agent","rt":$request_time}';

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  access_log /dev/stdout json_combined;
  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  # Cabeceras de seguridad (Shift Left)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'; frame-ancestors 'none'" always;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
  location ~* \.(css|js)$ { expires 7d; }
  location / { try_files $uri $uri/ =404; }
}

# Puerto interno (no se publica) para el exporter de Prometheus
server {
  listen 8081;
  location = /nginx_status { stub_status; access_log off; }
}
